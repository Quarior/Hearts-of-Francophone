 useful-events-quarior-install_missiles.1.t: "[FROM.GetNameDefCap] demand to have a strategic area"
 useful-events-quarior-install_missiles.1.d: "[FROM.GetNameDefCap] send us if they can have a strategic area to install missiles bases. What we should answer?"
 useful-events-quarior-install_missiles.1.a: "They can."
 useful-events-quarior-install_missiles.1.b: "We said no."
 useful-events-quarior-install_missiles.2.t: "[FROM.FROM.GetNameDefCap] install missiles bases in [FROM.GetAdjective] territory"
 useful-events-quarior-install_missiles.2.d: "[FROM.FROM.GetAdjective] and [FROM.GetAdjective] goverments was agree to authorize [FROM.FROM.GetNameDefCap] to install missiles bases."
 useful-events-quarior-install_missiles.2.a: "Excellent."
 useful-events-quarior-install_missiles.2.b: "Hope we made the good decision."
 useful-events-quarior-install_missiles.2.c: "Interesting."
 useful-events-quarior-install_missiles.3.t: "[FROM.GetNameDefCap] refuse"
 useful-events-quarior-install_missiles.3.d: "[FROM.GetNameDefCap] send  they are not agree with our idea."
