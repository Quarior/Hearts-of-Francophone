l_english:
 useful-events-quarior-referundum_anschluss.1.title: "[FROM.GetNameDefCap] demand referendum for unification"
 useful-events-quarior-referundum_anschluss.1.desc: "[FROM.GetNameDefCap] is calling for a referendum to merge our country with theirs. What we should do?"
 useful-events-quarior-referundum_anschluss.1.a: "Let's organize the referendum."
 useful-events-quarior-referundum_anschluss.1.b: "Let's organize the referendum but favorise "favor"."
 useful-events-quarior-referundum_anschluss.1.c: "Let's organize the referendum but favorise "against"."
 useful-events-quarior-referundum_anschluss.1.d: "Let's not organize the referendum."
 useful-events-quarior-referundum_anschluss.2.t: "[FROM.GetNameDefCap] merge with [FROM.FROM.GetNameDef]"
 useful-events-quarior-referundum_anschluss.2.d: "[FROM.GetNameDefCap] vote "favor" for unification with [FROM.FROM.GetNameDef]."
 useful-events-quarior-referundum_anschluss.2.a: "Welcome to the nation."
 useful-events-quarior-referundum_anschluss.2.b: "Interesting."
 useful-events-quarior-referundum_anschluss.2.c: "Let's join our new nation."
 useful-events-quarior-referundum_anschluss.3.t: "[FROM.GetNameDefCap] against the fusion with [FROM.FROM.GetNameDef]"
 useful-events-quarior-referundum_anschluss.3.d: "[FROM.GetNameDefCap] vote "against" for unification with [FROM.FROM.GetNameDef]."
 useful-events-quarior-referundum_anschluss.3.a: "How long do they think they are in front of us?"
 useful-events-quarior-referundum_anschluss.3.b: "Will a war occur?"
 useful-events-quarior-referundum_anschluss.3.c: "Hope the peace between ours countries will continue."
 useful-events-quarior-referundum_anschluss.3.e: "That's shame."
 useful-events-quarior-referundum_anschluss.4.t: "Referendum [FROM.GetAdjective] refused"
 useful-events-quarior-referundum_anschluss.4.desc: "[FROM.GetAdjective] leader [FROM.GetLeader] has publicly declared that the entire country is united in their opposition to unite with us, and that the very idea of a referendum on [FROM.GetAdjective] independence is utterly absurd."
 useful-events-quarior-referundum_anschluss.4.a: "We shall see how united they really are."
 useful-events-quarior-referundum_anschluss.4.b: ""Democracy" at work."
