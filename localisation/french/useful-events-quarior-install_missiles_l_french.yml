  useful-events-quarior-install_missiles.1.t:0 "[FROM.GetNameDefCap] demande d'avoir une zone stratégique"
  useful-events-quarior-install_missiles.1.d:0 "[FROM.GetNameDefCap] nous demande si ils peuvent disposer d'une zone stratégique pour installer des bases de missiles. Que devons-nous répondre ?"
  useful-events-quarior-install_missiles.1.a:0 "Autorisation accordée."
  useful-events-quarior-install_missiles.1.b:0 "Nous disons non."
  useful-events-quarior-install_missiles.2.t:0 "[FROM.FROM.GetNameDefCap] installe des bases de missiles sur le territoire de [FROM.GetAdjective]"
  useful-events-quarior-install_missiles.2.d:0 "Les gouvernements de [FROM.FROM.GetAdjective] et de [FROM.GetAdjective] se sont mis d'accord pour autoriser [FROM.FROM.GetNameDefCap] à installer des bases de missiles."
  useful-events-quarior-install_missiles.2.a:0 "Excellent."
  useful-events-quarior-install_missiles.2.b:0 "J'espère que nous avons pris la bonne décision."
  useful-events-quarior-install_missiles.2.c:0 "Intéréssent."
  useful-events-quarior-install_missiles.3.t:0 "[FROM.GetNameDefCap] refuse"
  useful-events-quarior-install_missiles.3.d:0 "[FROM.GetNameDefCap] envoie qu'ils ne sont pas d'accord avec notre idée."
  useful-events-quarior-install_missiles.3.a:0 "Ils ont pris la mauvaise décision."
  useful-events-quarior-install_missiles.3.b:0 "C'est dommage."
