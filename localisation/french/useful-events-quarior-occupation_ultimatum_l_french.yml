  useful-events-quarior-occupation_ultimatum.2.a:0 "Ils ont pris la bonne décision."
  useful-events-quarior-occupation_ultimatum.2.b:0 "L'influence [FROM.FROM.GetAdjective] grandie."
  useful-events-quarior-occupation_ultimatum.2.c:0 "Un jour, l'occupation prendra-t-elle fin ?"
