  useful-events-quarior-referundum_anschluss.1.title:0 "[FROM.GetNameDefCap] demande un référundum pour une unification"
  useful-events-quarior-referundum_anschluss.1.desc:0 "[FROM.GetNameDefCap] demande un référundum pour fusionner notre pays avec la leur. Que devons nous faire ?"
  useful-events-quarior-referundum_anschluss.1.a:0 "Organisons le référundum."
  useful-events-quarior-referundum_anschluss.1.b:0 "Organisons le référundum mais en favorisant le "pour"."
  useful-events-quarior-referundum_anschluss.1.c:0 "Organisons le référundum mais en favorisant le "contre"."
  useful-events-quarior-referundum_anschluss.1.d:0 "Nous n'organisons pas le référundum."
  useful-events-quarior-referundum_anschluss.2.t:0 "[FROM.GetNameDefCap] fusionne avec [FROM.FROM.GetNameDef]"
  useful-events-quarior-referundum_anschluss.2.d:0 "[FROM.GetNameDefCap] a voté "pour" l'unification avec [FROM.FROM.GetNameDef]."
  useful-events-quarior-referundum_anschluss.2.a:0 "Bienvenue dans la nation."
  useful-events-quarior-referundum_anschluss.2.b:0 "Intéréssent."
  useful-events-quarior-referundum_anschluss.2.c:0 "Rejoignons notre nouvelle nation."
  useful-events-quarior-referundum_anschluss.3.t:0 "[FROM.GetNameDefCap] contre la fusion avec [FROM.FROM.GetNameDef]"
  useful-events-quarior-referundum_anschluss.3.d:0 "[FROM.GetNameDefCap] a voté "contre" l'unification avec [FROM.FROM.GetNameDef]."
  useful-events-quarior-referundum_anschluss.3.a:0 "Combien de temps pensent-ils tenir contre nous ?"
  useful-events-quarior-referundum_anschluss.3.b:0 "Une guerre va se produire ?"
  useful-events-quarior-referundum_anschluss.3.c:0 "Espérons que la paix entre nos pays va continuer."
  useful-events-quarior-referundum_anschluss.3.e:0 "C'est dommage."
  useful-events-quarior-referundum_anschluss.4.t:0 "Référendum [FROM.GetAdjective] refusé"
  useful-events-quarior-referundum_anschluss.4.desc:0 "[FROM.GetLeLaFDirCap] dirigeant[FROM.GetXEDir] [FROM.GetDuDelaDelNP] [FROM.GetName], [FROM.GetLeLaLDir] [FROM.GetLeader], a fait une déclaration publique pour indiquer que les [FROM.GetAdjective] refusaient en bloc de s'unir avec nous, et que l'idée même d'un référendum sur l'indépendance du pays serait une véritable absurdité."
  useful-events-quarior-referundum_anschluss.4.a:0 "Nous allons bien voir à quel point ils font bloc."
  useful-events-quarior-referundum_anschluss.4.b:0 "La « démocratie » dans toute sa splendeur..."