l_simp_chinese:
 useful-events-quarior-anschluss.1.t: "[FROM.GetNameDefCap] 要求吞并"
 useful-events-quarior-anschluss.1.d: "[FROM.GetNameDefCap] 要求将我们的国家与他们合并。我们应该回答什么？"
 useful-events-quarior-anschluss.1.a: "我们太弱了，无法拒绝。让我们接受吧。"
 useful-events-quarior-anschluss.1.b: "这是断然的拒绝。"
 useful-events-quarior-anschluss.2.t: "[FROM.GetNameDefCap] 与 [FROM.FROM.GetNameDef] 合并"
 useful-events-quarior-anschluss.2.d: "[FROM.GetNameDefCap] 接受与 [FROM.FROM.GetNameDef] 合并。"
 useful-events-quarior-anschluss.2.a: "欢迎来到国家。"
 useful-events-quarior-anschluss.2.b: "有趣的。"
 useful-events-quarior-anschluss.2.c: "让我们加入我们的新国家吧。"
 useful-events-quarior-anschluss.3.t: "[FROM.GetNameDefCap]反对与[FROM.FROM.GetNameDef]融合"
 useful-events-quarior-anschluss.3.d: "[FROM.GetNameDefCap]拒绝与[FROM.FROM.GetNameDef]合并。"
 useful-events-quarior-anschluss.3.a: "他们认为自己在我们面前有多长时间？"
 useful-events-quarior-anschluss.3.b: "会发生战争吗？"
 useful-events-quarior-anschluss.3.c: "让我们做好防御准备。"
