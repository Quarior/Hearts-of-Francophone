l_simp_chinese:
 useful-events-quarior-coup.1.t: "未遂政变 [FROM.GetRulingIdeology]"
 useful-events-quarior-coup.1.desc: "在[FROM.GetNameDef]支持下的武装部队[ROOT.GetAdjective]成员策划了一场针对[ROOT.GetLeader]政府的政变。当[ROOT.GetLeader.GetSheHe]中了伏击并被捕时，[ROOT.GetLeader.GetSheHeCap]不得不对部队进行检查。\n$tab_news$我们正在等待这一企图的消息。"
 useful-events-quarior-coup.1.a: "希望一切顺利。"
 useful-events-quarior-coup.2.t: "[FROM.GetName] 中的政变 [FROM.FROM.GetRulingIdeology]"
 useful-events-quarior-coup.2.desc: "在[FROM.FROM.GetNameDef]支持下的武装部队[FROM.GetAdjective]成员策划了一场针对[FROM.GetLeader]政府的政变。当[FROM.GetLeader.GetSheHe]落入埋伏并被捕时，[FROM.GetLeader.GetSheHeCap]必须对部队进行检查。\n\n同时在[ROOT.Capital.GetCapitalVictoryPointName]，[FROM.FROM.GetRulingIdeology]游击队占领了该市的关键基础设施，包括其政府总部。国家的剩余部分现在由[FROM.FROM.GetRulingIdeology]政府控制。 \n\n大多数人民已经简单地接受了新政府的权威。"
 useful-events-quarior-coup.2.a: "我们的新政府开始了！"
 useful-events-quarior-coup.2.b: "革命[FROM.FROM.GetRulingIdeology]正在蔓延！"
 useful-events-quarior-coup.2.c: "[FROM.FROM.GetRulingIdeology] 威胁正在行进。"
 useful-events-quarior-coup.3.t: "[FROM.GetName] 政变 [ROOT.GetRulingIdeology] 失败"
 useful-events-quarior-coup.3.desc: "未遂政变于[FROM.GetName]失败。"
 useful-events-quarior-coup.3.a: "我们来强迫他们吧！"
 useful-events-quarior-coup.3.b: "那是耻辱。"
