l_simp_chinese:
 useful-events-quarior-install_missiles.1.t: "[FROM.GetNameDefCap] 要求拥有战略区域"
 useful-events-quarior-install_missiles.1.d: "[FROM.GetNameDefCap] 如果他们可以拥有战略区域来安装导弹基地，请告诉我们。我们应该回答什么？"
 useful-events-quarior-install_missiles.1.a: "他们可以。"
 useful-events-quarior-install_missiles.1.b: "我们说不。"
 useful-events-quarior-install_missiles.2.t: "[FROM.FROM.GetNameDefCap] 在 [FROM.GetAdjective] 领土安装导弹基地"
 useful-events-quarior-install_missiles.2.d: "[FROM.FROM.GetAdjective]和[FROM.GetAdjective]政府同意授权[FROM.FROM.GetNameDefCap]安装导弹基地。"
 useful-events-quarior-install_missiles.2.a: "出色的。"
 useful-events-quarior-install_missiles.2.b: "希望我们做出了正确的决定。"
 useful-events-quarior-install_missiles.2.c: "有趣的。"
 useful-events-quarior-install_missiles.3.t: "[FROM.GetNameDefCap]拒绝"
 useful-events-quarior-install_missiles.3.d: "[FROM.GetNameDefCap] 发送他们不同意我们的想法。"
 useful-events-quarior-install_missiles.3.a: "他们做出了最糟糕的决定。"
 useful-events-quarior-install_missiles.3.b: "那是耻辱。"
