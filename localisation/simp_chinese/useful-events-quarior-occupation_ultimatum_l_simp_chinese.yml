 useful-events-quarior-occupation_ultimatum.1.t: "[FROM.GetNameDefCap] 发出最后通牒"
 useful-events-quarior-occupation_ultimatum.1.d: "[FROM.GetNameDefCap] 发出最后通牒要求占领。我们应该回复什么？"
 useful-events-quarior-occupation_ultimatum.1.a: "让我们接受吧。"
 useful-events-quarior-occupation_ultimatum.1.b: "我们永远不会被占领！"
 useful-events-quarior-occupation_ultimatum.2.t: "[FROM.GetNameDefCap] 被 [FROM.FROM.GetNameDef] 占据"
 useful-events-quarior-occupation_ultimatum.2.d: "[FROM.GetNameDefCap] 接受被[FROM.FROM.GetNameDef] 占据。"
 useful-events-quarior-occupation_ultimatum.2.a: "他们做出了正确的决定。"
 useful-events-quarior-occupation_ultimatum.2.b: "[FROM.FROM.GetAdjective]的影响力是成长。"
 useful-events-quarior-occupation_ultimatum.2.c: "有一天，占领会结束吗？"
 useful-events-quarior-occupation_ultimatum.3.t: "[FROM.GetNameDefCap]反对占领[FROM.FROM.GetNameDef]"
 useful-events-quarior-occupation_ultimatum.3.d: "[FROM.GetNameDefCap]拒绝被[FROM.FROM.GetNameDef]占据。"
 useful-events-quarior-occupation_ultimatum.3.a: "我们去打仗吧。"
 useful-events-quarior-occupation_ultimatum.3.b: "会发生战争吗？"
 useful-events-quarior-occupation_ultimatum.3.c: "准备我们的防御。"
