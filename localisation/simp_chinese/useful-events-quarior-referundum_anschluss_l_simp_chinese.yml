l_simp_chinese:
 useful-events-quarior-referundum_anschluss.1.title: "[FROM.GetNameDefCap] 要求公投统一"
 useful-events-quarior-referundum_anschluss.1.desc: "[FROM.GetNameDefCap] 呼吁举行全民公投，将我们的国家与他们的国家合并。我们应该做什么？"
 useful-events-quarior-referundum_anschluss.1.a: "让我们组织公投吧。"
 useful-events-quarior-referundum_anschluss.1.b: "让我们组织一次公投，但偏向“偏向”。"
 useful-events-quarior-referundum_anschluss.1.c: "让我们组织一次公投，但赞成“反对”。"
 useful-events-quarior-referundum_anschluss.1.d: "我们不要组织公投。"
 useful-events-quarior-referundum_anschluss.2.t: "[FROM.GetNameDefCap] 与 [FROM.FROM.GetNameDef] 合并"
 useful-events-quarior-referundum_anschluss.2.d: "[FROM.GetNameDefCap] 投票“赞成”与 [FROM.FROM.GetNameDef] 统一。"
 useful-events-quarior-referundum_anschluss.2.a: "欢迎来到国家。"
 useful-events-quarior-referundum_anschluss.2.b: "有趣的。"
 useful-events-quarior-referundum_anschluss.2.c: "让我们加入我们的新国家吧。"
 useful-events-quarior-referundum_anschluss.3.t: "[FROM.GetNameDefCap]反对与[FROM.FROM.GetNameDef]融合"
 useful-events-quarior-referundum_anschluss.3.d: "[FROM.GetNameDefCap] 投票“反对”与 [FROM.FROM.GetNameDef] 的统一。"
 useful-events-quarior-referundum_anschluss.3.a: "他们认为自己在我们面前有多长时间？"
 useful-events-quarior-referundum_anschluss.3.b: "会发生战争吗？"
 useful-events-quarior-referundum_anschluss.3.c: "希望我们两国之间的和平能够继续下去。"
 useful-events-quarior-referundum_anschluss.3.e: "那是耻辱。"
 useful-events-quarior-referundum_anschluss.4.t: "公投 [FROM.GetAdjective] 被拒绝"
 useful-events-quarior-referundum_anschluss.4.desc: "[FROM.GetAdjective]领导人[FROM.GetLeader]公开宣称，整个国家团结一致反对与我们联合，而就[FROM.GetAdjective]独立进行公投的想法本身就是完全荒谬的。"
 useful-events-quarior-referundum_anschluss.4.a: "我们将会看到他们到底有多团结。"
 useful-events-quarior-referundum_anschluss.4.b: "工作中的“民主”。"
